<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(180deg,#eef3f9 0%,#dde8f3 45%,#c9d9ea 100%)}
  .roletab{padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s ease,color .2s ease}
  .code-input{width:44px;height:56px;text-align:center;font-size:24px;font-weight:700;border-radius:12px;border:1px solid #dde5ee;background:#f3f6fa;color:#0b1220;font-family:'Inter Tight',sans-serif}
</style>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box">
  <div style="width:100%;max-width:440px;background:#ffffff;border:1px solid rgba(15,23,42,0.08);border-radius:24px;box-shadow:0 30px 80px rgba(15,23,42,0.14);padding:32px">
    <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:22px">
      <img src="raya-logo.jpeg" style="width:28px;height:28px;border-radius:7px;object-fit:cover" alt="">
      <span style="font-size:14px;font-weight:800;font-family:'Inter Tight',sans-serif"><span style="color:#173d8a">Blue</span><span style="color:#2f7fe0">Stift</span></span>
    </div>

    <div style="display:flex;gap:2px;background:rgba(15,23,42,0.05);border-radius:99px;padding:4px;margin-bottom:24px">
      <div class="roletab" onClick="{{ selectStudent }}" style="flex:1;text-align:center;background:{{ roleBg.student }};color:{{ roleColor.student }}">Élève</div>
      <div class="roletab" onClick="{{ selectTeacher }}" style="flex:1;text-align:center;background:{{ roleBg.teacher }};color:{{ roleColor.teacher }}">Professeur</div>
    </div>

    <sc-if value="{{ isPending }}" hint-placeholder-val="{{ true }}">
      <h1 style="font-family:'Inter Tight',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.01em;margin:0 0 6px;text-align:center">{{ headline }}</h1>
      <p style="font-size:12.5px;color:#64748b;text-align:center;margin:0 0 24px;line-height:1.6">{{ subline }}</p>

      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:8px">
        <input class="code-input" maxlength="1" value="V">
        <input class="code-input" maxlength="1" value="O">
        <input class="code-input" maxlength="1" value="L">
        <input class="code-input" maxlength="1" value="T">
        <input class="code-input" maxlength="1" value="6">
        <input class="code-input" maxlength="1" value="A">
      </div>
      <p style="font-size:10.5px;color:#94a3b8;text-align:center;margin:8px 0 24px">Code fourni par ton établissement ({{ codeHint }})</p>

      <div onClick="{{ submitCode }}" style="cursor:pointer;background:#0b1220;color:#fff;border-radius:99px;padding:14px;text-align:center;font-size:13px;font-weight:600">Rejoindre l'établissement</div>
      <p style="font-size:11.5px;color:#64748b;text-align:center;margin-top:16px">Pas de code ? <span style="color:#2f7fe0;font-weight:600;cursor:pointer">Continuer sans école</span></p>
    </sc-if>

    <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 4px">
        <div style="width:56px;height:56px;border-radius:50%;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center;margin-bottom:18px">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h1 style="font-family:'Inter Tight',sans-serif;font-weight:800;font-size:19px;margin:0 0 6px">Bienvenue chez Lycée Voltaire</h1>
        <p style="font-size:12.5px;color:#64748b;margin:0 0 24px;line-height:1.6">{{ successLine }}</p>
        <div onClick="{{ enterApp }}" style="cursor:pointer;width:100%;background:#0b1220;color:#fff;border-radius:99px;padding:14px;text-align:center;font-size:13px;font-weight:600;box-sizing:border-box">{{ enterLabel }}</div>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { role: 'student', status: 'pending' };

  selectStudent = () => this.setState({ role: 'student' });
  selectTeacher = () => this.setState({ role: 'teacher' });
  submitCode = () => this.setState({ status: 'success' });
  enterApp = () => this.setState({ status: 'pending', role: this.state.role });

  renderVals() {
    const role = this.state.role;
    const isStudent = role === 'student';
    const cls = (on) => ({ bg: on ? '#ffffff' : 'transparent', color: on ? '#0b1220' : '#64748b' });
    const student = cls(isStudent), teacher = cls(!isStudent);
    return {
      isPending: this.state.status === 'pending',
      isSuccess: this.state.status === 'success',
      roleBg: { student: student.bg, teacher: teacher.bg },
      roleColor: { student: student.color, teacher: teacher.color },
      headline: isStudent ? 'Rejoins ta classe' : 'Rejoins ton établissement',
      subline: isStudent
        ? 'Entre le code donné par ton professeur pour accéder à tes cours et à RAYA.'
        : 'Entre le code donné par ton administrateur pour rejoindre l\'équipe enseignante.',
      codeHint: isStudent ? 'professeur ou administrateur' : 'administrateur',
      successLine: isStudent
        ? 'Tu es maintenant inscrit·e en 6e-A. RAYA connaît déjà ton programme.'
        : 'Ton compte professeur est activé. Tu peux voir tes classes dans Schools.',
      enterLabel: isStudent ? 'Aller à RAYA' : 'Aller à Schools',
      selectStudent: this.selectStudent, selectTeacher: this.selectTeacher,
      submitCode: this.submitCode, enterApp: this.enterApp,
    };
  }
}
</script>
</body>
</html>
